# GeoSpaX web app on Fly.io (https://geospax.fly.dev).
# Builds the root Dockerfile: nginx serves the app on port 80 and starts the
# optional Python sidecar. Deploy with `fly deploy` from the repository root.
app = "geospax"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
